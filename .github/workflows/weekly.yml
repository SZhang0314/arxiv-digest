name: Weekly arXiv Digest

on:
  schedule:
    # 每周一 00:00 UTC（北京时间 08:00）
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      window_hours:
        description: "时间窗口（小时）"
        default: "168"
      topics:
        description: "覆盖方向（逗号分隔，留空用 config.yml）"
        default: ""

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Optional window override
        if: ${{ github.event.inputs.window_hours != '' }}
        run: |
          python - <<'PY'
          import os, re
          h = os.environ['WIN']
          p = 'config.yml'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'window_hours:\s*\d+', 'window_hours: %s' % h, s)
          open(p, 'w', encoding='utf-8').write(s)
          PY
        env:
          WIN: ${{ github.event.inputs.window_hours }}

      - name: Fetch
        run: python scripts/fetch_arxiv.py

      - name: Translate
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scripts/translate.py

      - name: Review
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scripts/review.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: weekly digest $(date -u +%Y-%m-%d)"
            git push
          fi
